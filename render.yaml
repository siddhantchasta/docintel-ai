services:
  - type: web
    name: docintel-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://docintel-ai.vercel.app
      - key: STORAGE_DIR
        value: /data/storage
      - key: CHROMA_DIR
        value: /data/chroma_db
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/docintel.db
    disk:
      name: docintel-data
      mountPath: /data
      sizeGB: 1
